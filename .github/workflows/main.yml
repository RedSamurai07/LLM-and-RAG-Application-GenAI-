name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov numpy pandas rank-bm25

      - name: Run tests
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=85